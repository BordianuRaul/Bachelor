name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and test
        run: ./mvnw -B verify
      - name: SonarCloud analysis
        # BROKEN until HF-20/HF-19: the project was deleted and the token gets HTTP 403.
        # continue-on-error keeps it from blocking PRs meanwhile; the job's green check does NOT mean Sonar ran.
        # Skipped when no token is available (PRs from forks get no secrets).
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BordianuRaul_Bachelor
