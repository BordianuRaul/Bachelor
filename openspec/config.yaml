schema: spec-driven

# Constraints an agent can't read from the code. Workflow rules: HabbitFinder2.0/AGENTS.md (workspace).
context: |
  HabitFinder 2.0 backend, part of Raul Bordianu's master's dissertation (databases master's, UBB Cluj).
  The database schema is a subject of the dissertation: every schema decision must be versioned,
  reviewable and explainable in the thesis.
  One HF task = one PR within the code budget in the workspace AGENTS.md ("PR size"). SQL migrations
  count toward that budget; they are hand-written, never "generated code".
  This repo's openspec/ specifies the HTTP API contract the Flutter client (BordianuRaul/BachelorFrontend)
  consumes. The client checks exact status codes, so a contract change states every status code and
  needs a paired client task.

rules:
  proposal:
    - 'Title starts with the HF task ID, e.g. "HF-6: Baseline the schema with Flyway"'
    - Keep it under one page
    - Always state what is out of scope
  specs:
    - 'Every requirement has at least one scenario; each scenario is covered by a test or marked "(manual: <reason>)"'
    - API requirements state request shape, response shape and every status code
  design:
    - Name at least one rejected alternative and why it lost
  tasks:
    - The whole tasks.md must fit one PR within the code budget; if it can't, stop and propose a split to Raul
    - 'Every spec scenario maps to a test task, or names the HF task that adds the missing test setup (e.g. DB tests need Testcontainers, HF-7), or is marked "(manual: <reason>)"'
    - Schema changes are Flyway migrations in backend/src/main/resources/db/migration/V<n>__<description>.sql; never ddl-auto=update or create
    - A merged migration is never edited (Flyway checksums would fail); fixes go in a new V<n+1> migration

operations:
  apply:
    guidance:
      - Run openspec validate on the change before the adversarial review
  archive:
    guidance:
      - Write review.md (the adversarial review record) into the change before archiving
      - Archive before opening the PR, never after
